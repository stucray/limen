services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: auth
      POSTGRES_USER: auth
      POSTGRES_PASSWORD: secret
    ports:
      - "5433:5432"
    volumes:
      - auth_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth -d auth"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Mailpit captures every outbound email (SMTP on 1025) and exposes a web
  # inbox at http://localhost:8025. Lightweight (~25MB image, single Go
  # binary) so it's always-on alongside Postgres. Captured messages live in
  # memory only — restart wipes the inbox, which matches the dev workflow.
  # To deliver to it, run with `--spring.profiles.active=mailpit` (see
  # src/main/resources/application-mailpit.yaml). Default profile keeps
  # `limen.email.driver: logging` so emails go to the application log.
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # web UI / API
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8025/api/v1/info"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Grafana LGTM all-in-one: Grafana + Mimir (Prom-compatible TSDB) + Loki +
  # Tempo + an OTel Collector, in a single image. Receives OTLP/HTTP on 4318;
  # serves Grafana on http://localhost:3000 (admin / admin). Behind the
  # `observability` compose profile so it only starts when explicitly
  # requested (`docker compose --profile observability up -d`) — image is
  # ~500MB and most `mvn spring-boot:run` sessions don't need dashboards.
  # Spring Boot's Docker Compose support auto-detects this service and
  # wires OTEL_EXPORTER_OTLP_ENDPOINT for the running app. See
  # dev/observability/README.md for usage. Grafana Labs flag this image as
  # dev/demo only (no HA, no durable storage); production would point the
  # OTel exporter at a real backend via env vars.
  otel-lgtm:
    image: grafana/otel-lgtm:latest
    profiles: ["observability"]
    ports:
      - "3000:3000"  # Grafana UI
      - "4318:4318"  # OTLP / HTTP (protobuf)
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  auth_postgres_data:
