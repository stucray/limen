name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: build, test, static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      LIMEN_SECURITY_KEK: ${{ secrets.LIMEN_SECURITY_KEK_TEST }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 26 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '26'
          cache: maven

      - name: Verify (compile + Error Prone + NullAway + tests + JaCoCo + PMD report)
        run: ./mvnw -B -ntp verify

      - name: Upload PMD complexity report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pmd-complexity-report
          path: |
            target/pmd.xml
            target/reports/pmd.html
            target/reports/xref
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload JaCoCo report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          path: target/site/jacoco
          if-no-files-found: ignore
          retention-days: 14
