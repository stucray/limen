<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout(~{::title}, ~{::main})}">
<head>
    <title th:text="|Sign in — ${tenantName}|">Sign in — Limen</title>
</head>
<body>
<main>
    <article class="card card--auth">
        <hgroup>
            <h1>Sign in</h1>
            <p th:text="${tenantName}">Tenant</p>
        </hgroup>
        <p class="form-error" th:if="${param.error}">Invalid username or password.</p>
        <p class="form-info" th:if="${param.registered}">Account created — please sign in.</p>
        <form method="post" th:action="@{'/manage/t/' + ${slug} + '/login'}" class="stack">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <label>
                Username
                <input type="text" name="username" autofocus required/>
            </label>
            <label>
                Password
                <input type="password" name="password" required/>
            </label>
            <button type="submit" class="btn--block">Sign in</button>
        </form>
    </article>
</main>
</body>
</html>
