<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout-authed :: layout(~{::title}, ~{::main})}">
<head><title>New application</title></head>
<body>
<main class="container">
    <ol class="breadcrumb" aria-label="breadcrumb">
        <li><a th:href="@{'/manage/t/' + ${slug} + '/'}">Home</a></li>
        <li><a th:href="@{'/manage/t/' + ${slug} + '/applications'}">Applications</a></li>
        <li>New</li>
    </ol>

    <hgroup>
        <h1>New application</h1>
        <p>Register a new application in this tenant.</p>
    </hgroup>

    <p class="form-error" th:if="${errorMessage}" th:text="${errorMessage}"></p>

    <form method="post" th:action="@{'/manage/t/' + ${slug} + '/applications'}" class="stack section">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <label>
            Name
            <input type="text" name="name" th:value="${name}" autofocus required/>
        </label>
        <label>
            Description
            <textarea name="description" th:text="${description}"></textarea>
        </label>
        <div class="form-actions">
            <button type="submit">Create</button>
            <a th:href="@{'/manage/t/' + ${slug} + '/applications'}" class="btn btn--secondary">Cancel</a>
        </div>
    </form>
</main>
</body>
</html>
