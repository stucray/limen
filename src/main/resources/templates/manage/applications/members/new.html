<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout-authed :: layout(~{::title}, ~{::main})}">
<head><title>Add member</title></head>
<body>
<main class="container">
    <ol class="breadcrumb" aria-label="breadcrumb">
        <li><a th:href="@{'/manage/t/' + ${slug} + '/'}">Home</a></li>
        <li><a th:href="@{'/manage/t/' + ${slug} + '/applications'}">Applications</a></li>
        <li th:text="${app.name()}">App</li>
        <li><a th:href="@{'/manage/t/' + ${slug} + '/applications/' + ${app.id()} + '/members'}">Members</a></li>
        <li>Add</li>
    </ol>

    <hgroup>
        <h1>Add member</h1>
        <p th:text="${app.name()}">App name</p>
    </hgroup>

    <p class="form-error" th:if="${errorMessage}" th:text="${errorMessage}"></p>

    <form th:if="${!grantableUsers.isEmpty()}" method="post"
          th:action="@{'/manage/t/' + ${slug} + '/applications/' + ${app.id()} + '/members'}"
          class="stack section">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <label>
            User
            <select name="userId" required>
                <option th:each="u : ${grantableUsers}" th:value="${u.id()}" th:text="${u.email()}"></option>
            </select>
        </label>
        <div class="form-actions">
            <button type="submit">Grant membership</button>
            <a th:href="@{'/manage/t/' + ${slug} + '/applications/' + ${app.id()} + '/members'}" class="btn btn--secondary">Cancel</a>
        </div>
    </form>
    <p class="empty-state" th:if="${grantableUsers.isEmpty()}">All users in this tenant already have a membership for this application.</p>
</main>
</body>
</html>
