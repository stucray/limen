<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout-authed :: layout(~{::title}, ~{::main})}">
<head>
    <title th:text="|${tenantName} — Limen|">Limen</title>
</head>
<body>
<main class="container">
    <hgroup>
        <h1 th:text="${tenantName}">Tenant</h1>
        <p>Welcome, <span th:text="${username}">user</span>.</p>
    </hgroup>

    <nav class="nav-tiles">
        <ul th:if="${isSystemAdmin}">
            <li><a th:href="@{'/manage/system/tenants'}" class="nav-tile">
                <span class="nav-tile__title">Tenants</span>
                <span class="nav-tile__desc">Manage tenants across the system.</span>
            </a></li>
        </ul>
        <ul th:unless="${isSystemAdmin}">
            <li><a th:href="@{'/manage/t/' + ${slug} + '/users'}" class="nav-tile">
                <span class="nav-tile__title">Users</span>
                <span class="nav-tile__desc">User accounts and ownership.</span>
            </a></li>
            <li><a th:href="@{'/manage/t/' + ${slug} + '/applications'}" class="nav-tile">
                <span class="nav-tile__title">Applications</span>
                <span class="nav-tile__desc">Application registrations and roles.</span>
            </a></li>
            <li><a th:href="@{'/manage/t/' + ${slug} + '/settings'}" class="nav-tile">
                <span class="nav-tile__title">Tenant Settings</span>
                <span class="nav-tile__desc">Tenant-level configuration.</span>
            </a></li>
        </ul>
    </nav>
</main>
</body>
</html>
