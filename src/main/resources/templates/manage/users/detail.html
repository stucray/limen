<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout-authed :: layout(~{::title}, ~{::main})}">
<head><title th:text="'User · ' + ${user.email()}">User</title></head>
<body>
<main class="container">
    <ol class="breadcrumb" aria-label="breadcrumb">
        <li><a th:href="@{'/manage/t/' + ${slug} + '/'}">Home</a></li>
        <li><a th:href="@{'/manage/t/' + ${slug} + '/users'}">Users</a></li>
        <li th:text="${user.email()}">user</li>
    </ol>

    <hgroup>
        <h1 th:text="${user.email()}">email</h1>
        <p>User account details.</p>
    </hgroup>

    <section class="section">
        <h2>Details</h2>
        <dl class="detail-list">
            <dt>Status</dt>
            <dd>
                <span th:if="${user.enabled()}" class="badge badge--success">Active</span>
                <span th:unless="${user.enabled()}" class="badge badge--muted">Disabled</span>
            </dd>
            <dt>Tenant Owner</dt>
            <dd th:text="${user.tenantOwner()} ? 'Yes' : 'No'"></dd>
        </dl>
    </section>

    <section class="section">
        <h2>Memberships</h2>

        <p class="empty-state" th:if="${#lists.isEmpty(appMemberships)}">
            No Memberships yet. Grant this user access from an
            <a th:href="@{'/manage/t/' + ${slug} + '/applications'}">Application</a>.
        </p>

        <ul class="tree" th:unless="${#lists.isEmpty(appMemberships)}">
            <li th:each="app : ${appMemberships}">
                <a th:href="@{'/manage/t/' + ${slug} + '/applications/' + ${app.applicationId()} + '/members'}"
                   th:text="${app.applicationName()}">App name</a>
                <span class="muted" th:if="${#lists.isEmpty(app.appRoles())}"> — no App Roles</span>
                <span class="muted" th:unless="${#lists.isEmpty(app.appRoles())}">
                    — App Roles: <span th:text="${#strings.listJoin(app.appRoles(), ', ')}">role names</span>
                </span>

                <ul class="tree__sub" th:if="${!#lists.isEmpty(app.clientMemberships())}">
                    <li th:each="client : ${app.clientMemberships()}">
                        <a th:href="@{'/manage/t/' + ${slug} + '/applications/' + ${app.applicationId()} + '/clients/' + ${client.registeredClientId()} + '/members'}"
                           th:text="${client.clientDisplayName()}">Client name</a>
                        <span class="muted" th:if="${#lists.isEmpty(client.clientRoles())}"> — no Client Roles</span>
                        <span class="muted" th:unless="${#lists.isEmpty(client.clientRoles())}">
                            — Client Roles: <span th:text="${#strings.listJoin(client.clientRoles(), ', ')}">role names</span>
                        </span>
                    </li>
                </ul>
            </li>
        </ul>
    </section>
</main>
</body>
</html>
