<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout-authed :: layout(~{::title}, ~{::main})}">
<head><title>Users</title></head>
<body>
<main class="container">
    <ol class="breadcrumb" aria-label="breadcrumb">
        <li><a th:href="@{'/manage/t/' + ${slug} + '/'}">Home</a></li>
        <li>Users</li>
    </ol>

    <div class="page-header">
        <hgroup>
            <h1>Users</h1>
            <p>Manage user accounts for this tenant.</p>
        </hgroup>
        <a th:href="@{'/manage/t/' + ${slug} + '/users/new'}" class="btn" data-test-action="users-new">Add user</a>
    </div>

    <table>
        <thead>
            <tr>
                <th scope="col">Username</th>
                <th scope="col">Status</th>
                <th scope="col">Tenant Owner</th>
                <th scope="col">Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="user : ${users}">
                <td><a th:href="@{'/manage/t/' + ${slug} + '/users/' + ${user.id()}}" th:text="${user.username()}"></a></td>
                <td>
                    <span th:if="${user.enabled()}" class="badge badge--success">Active</span>
                    <span th:unless="${user.enabled()}" class="badge badge--muted">Disabled</span>
                </td>
                <td th:text="${user.tenantOwner() ? 'Yes' : 'No'}"></td>
                <td>
                    <div class="actions">
                        <form method="post" th:action="@{'/manage/t/' + ${slug} + '/users/' + ${user.id()} + '/enable'}" th:if="${!user.enabled()}">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <button type="submit" class="btn--secondary">Enable</button>
                        </form>
                        <form method="post" th:action="@{'/manage/t/' + ${slug} + '/users/' + ${user.id()} + '/disable'}" th:if="${user.enabled()}">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <button type="submit" class="btn--secondary">Disable</button>
                        </form>
                        <a th:href="@{'/manage/t/' + ${slug} + '/users/' + ${user.id()} + '/reset-password'}" class="btn btn--secondary">Reset password</a>
                        <form method="post" th:action="@{'/manage/t/' + ${slug} + '/users/' + ${user.id()} + '/grant-owner'}" th:if="${!user.tenantOwner()}">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <button type="submit" class="btn--secondary">Grant owner</button>
                        </form>
                        <form method="post" th:action="@{'/manage/t/' + ${slug} + '/users/' + ${user.id()} + '/revoke-owner'}" th:if="${user.tenantOwner()}">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <button type="submit" class="btn--secondary">Revoke owner</button>
                        </form>
                        <form method="post" th:action="@{'/manage/t/' + ${slug} + '/users/' + ${user.id()} + '/delete'}">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <button type="submit" class="btn--danger" onclick="return confirm('Delete this user?')">Delete</button>
                        </form>
                    </div>
                </td>
            </tr>
        </tbody>
    </table>
</main>
</body>
</html>
