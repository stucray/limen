<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout-authed :: layout(~{::title}, ~{::main})}">
<head><title>Tenants — System Admin</title></head>
<body>
<main class="container">
    <ol class="breadcrumb" aria-label="breadcrumb">
        <li><a th:href="@{/manage/t/system/}">Home</a></li>
        <li>Tenants</li>
    </ol>

    <hgroup>
        <h1>Tenants</h1>
        <p>Manage tenants across the system.</p>
    </hgroup>

    <p class="form-error" th:if="${errorMessage}" th:text="${errorMessage}"></p>
    <p class="form-info" th:if="${successMessage}" th:text="${successMessage}"></p>

    <table>
        <thead>
            <tr>
                <th scope="col">Slug</th>
                <th scope="col">Display Name</th>
                <th scope="col">Status</th>
                <th scope="col">Created</th>
                <th scope="col">Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="tenant : ${tenants}">
                <td><code th:text="${tenant.slug()}"></code></td>
                <td th:text="${tenant.displayName()}"></td>
                <td>
                    <span th:if="${tenant.status().name() == 'ACTIVE'}" class="badge badge--success" th:text="${tenant.status()}">ACTIVE</span>
                    <span th:unless="${tenant.status().name() == 'ACTIVE'}" class="badge badge--muted" th:text="${tenant.status()}">SUSPENDED</span>
                </td>
                <td class="muted" th:text="${#temporals.format(tenant.createdAt(), 'yyyy-MM-dd')}"></td>
                <td>
                    <div class="actions" th:unless="${tenant.isSystem()}">
                        <form method="post" th:action="@{'/manage/system/tenants/' + ${tenant.id()} + '/suspend'}" th:if="${tenant.status().name() == 'ACTIVE'}">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <button type="submit" class="btn--secondary">Suspend</button>
                        </form>
                        <form method="post" th:action="@{'/manage/system/tenants/' + ${tenant.id()} + '/unsuspend'}" th:if="${tenant.status().name() == 'SUSPENDED'}">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <button type="submit" class="btn--secondary">Unsuspend</button>
                        </form>
                        <form method="post" th:action="@{'/manage/system/tenants/' + ${tenant.id()} + '/delete'}">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <button type="submit" class="btn--danger" onclick="return confirm('Delete this tenant and all its data?')">Delete</button>
                        </form>
                    </div>
                    <span th:if="${tenant.isSystem()}" class="muted">—</span>
                </td>
            </tr>
        </tbody>
    </table>
</main>
</body>
</html>
