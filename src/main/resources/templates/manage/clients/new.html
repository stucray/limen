<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout-authed :: layout(~{::title}, ~{::main})}">
<head><title>New client</title></head>
<body>
<main class="container">
    <ol class="breadcrumb" aria-label="breadcrumb">
        <li><a th:href="@{'/manage/t/' + ${slug} + '/'}">Home</a></li>
        <li><a th:href="@{'/manage/t/' + ${slug} + '/applications'}">Applications</a></li>
        <li th:text="${app.name()}">App</li>
        <li><a th:href="@{'/manage/t/' + ${slug} + '/applications/' + ${app.id()} + '/clients'}">Clients</a></li>
        <li>New</li>
    </ol>

    <hgroup>
        <h1>New client</h1>
        <p th:text="${app.name()}">App name</p>
    </hgroup>

    <form method="post" th:action="@{'/manage/t/' + ${slug} + '/applications/' + ${app.id()} + '/clients'}" class="stack">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

        <section class="section">
            <label>
                Name
                <input type="text" name="displayName" autofocus required/>
            </label>
        </section>

        <fieldset>
            <legend>Grant types</legend>
            <label><input type="checkbox" name="grantTypes" value="authorization_code"/> Authorization code</label>
            <label><input type="checkbox" name="grantTypes" value="client_credentials"/> Client credentials</label>
            <label><input type="checkbox" name="grantTypes" value="refresh_token"/> Refresh token</label>
        </fieldset>

        <section class="section">
            <label>
                Redirect URIs (one per line)
                <textarea name="redirectUris" rows="3"></textarea>
            </label>
            <label>
                Post-logout redirect URIs (one per line)
                <textarea name="postLogoutRedirectUris" rows="2"></textarea>
            </label>
            <label>
                Scopes
                <input type="text" name="scopes"/>
                <small>Whitespace- or comma-separated (e.g. <code>openid profile</code>). Required for the <code>authorization_code</code> grant.</small>
            </label>
        </section>

        <fieldset>
            <legend>Token settings</legend>
            <label>
                Access token TTL (minutes)
                <input type="number" name="accessTokenTtlMinutes" value="5" min="1" required/>
            </label>
            <label>
                Refresh token TTL (days)
                <input type="number" name="refreshTokenTtlDays" value="30" min="1" required/>
            </label>
            <label><input type="checkbox" name="reuseRefreshTokens"/> Reuse refresh tokens (uncheck to rotate)</label>
            <label><input type="checkbox" name="requirePkce"/> Require PKCE</label>
            <label><input type="checkbox" name="requireConsent"/> Require user consent on authorize</label>
            <small>Known issue (<a href="https://github.com/stucray/limen/issues/276" target="_blank" rel="noopener">#276</a>): enabling consent currently breaks first authorize. Leave off until fixed.</small>
            <label><input type="checkbox" name="confidential" value="true" checked/> Confidential (has client secret)</label>
        </fieldset>

        <div class="form-actions">
            <button type="submit" data-test-action="clients-create-submit">Create client</button>
            <a th:href="@{'/manage/t/' + ${slug} + '/applications/' + ${app.id()} + '/clients'}" class="btn btn--secondary">Cancel</a>
        </div>
    </form>
</main>
</body>
</html>
