<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout-authed :: layout(~{::title}, ~{::main})}">
<head><title>Clients</title></head>
<body>
<main class="container">
    <ol class="breadcrumb" aria-label="breadcrumb">
        <li><a th:href="@{'/manage/t/' + ${slug} + '/'}">Home</a></li>
        <li><a th:href="@{'/manage/t/' + ${slug} + '/applications'}">Applications</a></li>
        <li th:text="${app.name()}">App</li>
        <li>Clients</li>
    </ol>

    <div class="page-header">
        <hgroup>
            <h1>Clients</h1>
            <p>OAuth clients for <strong th:text="${app.name()}">app</strong>.</p>
        </hgroup>
        <a th:href="@{'/manage/t/' + ${slug} + '/applications/' + ${app.id()} + '/clients/new'}" class="btn" data-test-action="clients-new">New client</a>
    </div>

    <div class="alert alert--secret" th:if="${clientSecret}">
        <strong>Client secret (shown once — copy it now):</strong>
        <code th:text="${clientSecret}" data-test-flash="client-secret"></code>
        <span><strong>Client ID:</strong> <code th:text="${clientId}" data-test-flash="client-id"></code></span>
    </div>

    <table>
        <thead>
            <tr>
                <th scope="col">Name</th>
                <th scope="col">Type</th>
                <th scope="col">Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="client : ${clients}">
                <td><a th:href="@{'/manage/t/' + ${slug} + '/applications/' + ${app.id()} + '/clients/' + ${client.registeredClientId()} + '/edit'}" th:text="${client.displayName()}"></a></td>
                <td>
                    <span th:if="${client.confidential()}" class="badge">Confidential</span>
                    <span th:unless="${client.confidential()}" class="badge badge--muted">Public</span>
                </td>
                <td>
                    <div class="actions">
                        <a th:href="@{'/manage/t/' + ${slug} + '/applications/' + ${app.id()} + '/clients/' + ${client.registeredClientId()} + '/edit'}" class="btn btn--secondary">Edit</a>
                        <a th:href="@{'/manage/t/' + ${slug} + '/applications/' + ${app.id()} + '/clients/' + ${client.registeredClientId()} + '/members'}" class="btn btn--secondary">Members</a>
                        <form method="post" th:action="@{'/manage/t/' + ${slug} + '/applications/' + ${app.id()} + '/clients/' + ${client.registeredClientId()} + '/rotate-secret'}" th:if="${client.confidential()}">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <button type="submit" class="btn--secondary">Rotate secret</button>
                        </form>
                        <form method="post" th:action="@{'/manage/t/' + ${slug} + '/applications/' + ${app.id()} + '/clients/' + ${client.registeredClientId()} + '/delete'}">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <button type="submit" class="btn--danger" onclick="return confirm('Delete this client?')">Delete</button>
                        </form>
                    </div>
                </td>
            </tr>
        </tbody>
    </table>
</main>
</body>
</html>
