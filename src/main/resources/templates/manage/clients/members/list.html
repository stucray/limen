<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout-authed :: layout(~{::title}, ~{::main})}">
<head><title>Client members</title></head>
<body>
<main class="container">
    <ol class="breadcrumb" aria-label="breadcrumb">
        <li><a th:href="@{'/manage/t/' + ${slug} + '/'}">Home</a></li>
        <li><a th:href="@{'/manage/t/' + ${slug} + '/applications'}">Applications</a></li>
        <li th:text="${app.name()}">App</li>
        <li><a th:href="@{'/manage/t/' + ${slug} + '/applications/' + ${app.id()} + '/clients'}">Clients</a></li>
        <li th:text="${client.displayName()}">Client</li>
        <li>Members</li>
    </ol>

    <div class="page-header">
        <hgroup>
            <h1>Members</h1>
            <p><strong th:text="${client.displayName()}">client</strong> on <strong th:text="${app.name()}">app</strong></p>
        </hgroup>
        <a th:href="@{'/manage/t/' + ${slug} + '/applications/' + ${app.id()} + '/clients/' + ${client.registeredClientId()} + '/members/new'}" class="btn">Add member</a>
    </div>

    <p class="form-error" th:if="${errorMessage}" th:text="${errorMessage}"></p>

    <table>
        <thead>
            <tr>
                <th scope="col">User</th>
                <th scope="col">Roles</th>
                <th scope="col">Granted at</th>
                <th scope="col">Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="m : ${memberships}">
                <td th:text="${emailsById.get(m.userId())}"></td>
                <td>
                    <span th:if="${#lists.isEmpty(m.roleIds())}" class="muted">—</span>
                    <span th:unless="${#lists.isEmpty(m.roleIds())}">
                        <span th:each="rid, it : ${m.roleIds()}"><span th:text="${roleNamesById.get(rid)}"></span><span th:if="${!it.last}">, </span></span>
                    </span>
                </td>
                <td th:text="${m.grantedAt()}" class="muted"></td>
                <td>
                    <div class="actions">
                        <a th:href="@{'/manage/t/' + ${slug} + '/applications/' + ${app.id()} + '/clients/' + ${client.registeredClientId()} + '/members/' + ${m.id()} + '/edit'}" class="btn btn--secondary">Edit roles</a>
                        <form method="post" th:action="@{'/manage/t/' + ${slug} + '/applications/' + ${app.id()} + '/clients/' + ${client.registeredClientId()} + '/members/' + ${m.id()} + '/delete'}">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <button type="submit" class="btn--danger" onclick="return confirm('Revoke this client membership?')">Revoke</button>
                        </form>
                    </div>
                </td>
            </tr>
        </tbody>
    </table>
</main>
</body>
</html>
