<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout-authed :: layout(~{::title}, ~{::main})}">
<head><title>Add client member</title></head>
<body>
<main class="container">
    <ol class="breadcrumb" aria-label="breadcrumb">
        <li><a th:href="@{'/manage/t/' + ${slug} + '/'}">Home</a></li>
        <li><a th:href="@{'/manage/t/' + ${slug} + '/applications'}">Applications</a></li>
        <li th:text="${app.name()}">App</li>
        <li><a th:href="@{'/manage/t/' + ${slug} + '/applications/' + ${app.id()} + '/clients'}">Clients</a></li>
        <li th:text="${client.displayName()}">Client</li>
        <li><a th:href="@{'/manage/t/' + ${slug} + '/applications/' + ${app.id()} + '/clients/' + ${client.registeredClientId()} + '/members'}">Members</a></li>
        <li>Add</li>
    </ol>

    <hgroup>
        <h1>Add member</h1>
        <p><strong th:text="${client.displayName()}">client</strong> on <strong th:text="${app.name()}">app</strong></p>
    </hgroup>

    <p class="form-error" th:if="${errorMessage}" th:text="${errorMessage}"></p>

    <form th:if="${!grantableUsers.isEmpty()}" method="post"
          th:action="@{'/manage/t/' + ${slug} + '/applications/' + ${app.id()} + '/clients/' + ${client.registeredClientId()} + '/members'}"
          class="stack section">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <label>
            User
            <select name="userId" required>
                <option th:each="u : ${grantableUsers}" th:value="${u.id()}" th:text="${u.username()}"></option>
            </select>
        </label>
        <div class="form-actions">
            <button type="submit">Grant client membership</button>
            <a th:href="@{'/manage/t/' + ${slug} + '/applications/' + ${app.id()} + '/clients/' + ${client.registeredClientId()} + '/members'}" class="btn btn--secondary">Cancel</a>
        </div>
    </form>
    <p class="empty-state" th:if="${grantableUsers.isEmpty()}">
        No eligible users. Application Membership for this app is required first; once granted, users will appear here.
    </p>
</main>
</body>
</html>
