<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout(~{::title}, ~{::main})}">
<head><title>Sign up — Limen</title></head>
<body>
<main>
    <article class="card card--auth">
        <hgroup>
            <h1>Create your Limen account</h1>
            <p>Set up a new tenant with you as its first owner.</p>
        </hgroup>
        <form method="post" th:action="@{/signup}" class="stack">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

            <label>
                Organization name
                <input type="text" name="organizationName" th:value="${form.organizationName()}" autofocus required/>
                <span class="form-error" th:if="${errorField == 'organizationName'}" th:text="${errorMessage}"></span>
            </label>

            <label>
                Slug
                <input type="text" name="slug" th:value="${form.slug()}"
                       pattern="[a-z0-9][a-z0-9\-]{1,46}[a-z0-9]" required/>
                <small class="muted">Your management URL will be <code>/manage/t/{slug}/</code></small>
                <span class="form-error" th:if="${errorField == 'slug'}" th:text="${errorMessage}"></span>
            </label>

            <label>
                Email
                <input type="email" name="email" th:value="${form.email()}" required/>
                <span class="form-error" th:if="${errorField == 'email'}" th:text="${errorMessage}"></span>
            </label>

            <label>
                Full name <span class="muted">(optional)</span>
                <input type="text" name="fullName" th:value="${form.fullName()}"/>
                <small class="muted">Shown to applications you sign in to when they request the OIDC <code>profile</code> scope.</small>
            </label>

            <label>
                Password
                <input type="password" name="password" required/>
                <span class="form-error" th:if="${errorField == 'password'}" th:text="${errorMessage}"></span>
            </label>

            <button type="submit" class="btn--block" data-test-action="signup-submit">Create account</button>
        </form>
    </article>
</main>
</body>
</html>
