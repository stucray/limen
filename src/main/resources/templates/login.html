<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout(~{::title}, ~{::main})}">
<head><title>Sign in</title></head>
<body>
<main>
    <article class="card card--auth">
        <hgroup>
            <h1>Sign in</h1>
            <p th:if="${tenantName}" th:text="${tenantName}">Tenant</p>
        </hgroup>
        <p class="form-error" th:if="${param.error != null and param.error[0] == 'locked'}"
           data-test-action="login-error-locked">
            Account is locked due to too many failed attempts. Try again later or contact your tenant admin to unlock.
        </p>
        <p class="form-error" th:if="${param.error != null and param.error[0] != 'locked'}"
           data-test-action="login-error">
            Invalid email or password.
        </p>
        <form method="post" th:action="@{/t/{slug}/login(slug=${tenantSlug})}" class="stack">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <label>
                Email
                <input type="email" name="email" autofocus required/>
            </label>
            <label>
                Password
                <input type="password" name="password" required/>
            </label>
            <label>
                <input type="checkbox" name="remember-me"/>
                Remember me for 14 days
            </label>
            <button type="submit" class="btn--block" data-test-action="login-submit">Sign in</button>
        </form>
        <p>
            <a th:href="@{/t/{slug}/forgot-password(slug=${tenantSlug})}"
               data-test-action="forgot-password-link">Forgot your password?</a>
        </p>
    </article>
</main>
</body>
</html>
