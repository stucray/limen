spring:
  application:
    name: limen
  datasource:
    url: jdbc:postgresql://localhost:5433/auth
    username: auth
    password: secret
  flyway:
    enabled: true
  docker:
    compose:
      lifecycle-management: start_only
server:
  port: 8090
  servlet:
    session:
      timeout: 30m
management:
  endpoints:
    web:
      exposure:
        include: health
