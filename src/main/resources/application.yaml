limen:
  security:
    # Override in production. Used to sign the remember-me cookie identity.
    remember-me-key: dev-remember-me-key-change-me
    # 14 days
    remember-me-validity-seconds: 1209600
  email:
    # logging | smtp. Base default is `logging` — outbound emails land at
    # slf4j INFO. The spring-boot-maven-plugin is configured to auto-activate
    # the `mailpit` profile on `mvn spring-boot:run`, which flips this to
    # `smtp` and points spring.mail at the Mailpit container in
    # docker-compose.yml (web inbox at http://localhost:8025). The base
    # default still applies to `mvn test`/`verify` and the production image,
    # which override via env vars in real deployments.
    driver: logging
    # From-address on every outbound message. The base default is fine for
    # logging + Mailpit (both accept anything). Real SMTP providers (Resend,
    # Brevo, SES, …) reject sends from a domain they don't own — override
    # via LIMEN_EMAIL_FROM per environment so the domain matches whatever
    # has been verified at the provider.
    from: no-reply@limen.local
  lockout:
    # Consecutive failed-login attempts before the account is locked. Small
    # enough to defeat credential stuffing, large enough to absorb fat-finger.
    threshold: 5
    # How long the lock holds; admins can short-circuit via the user-detail
    # "Unlock account" button on /manage/t/{slug}/users/{userId}.
    window: 15m
  signing-key-rotation:
    # Daily 3am UTC scheduled batch driver. The placeholder is resolved by
    # Spring's @Scheduled cron at bean-init, so it must live in the
    # Environment — record @DefaultValue alone is not enough.
    enabled: true
    cron: "0 0 3 * * *"
    key-age: 30d
    grace-period: 24h
  pending-authorize-sweep:
    # Hourly sweep of expired pending /authorize records (issue #327). The
    # placeholder is resolved by @Scheduled at bean-init, so it must live in the
    # Environment. Expiry is also filtered on read, so this is pure housekeeping.
    enabled: true
    cron: "0 0 * * * *"
  rate-limit:
    # Token-bucket throttling on pre-auth endpoints (RateLimitFilter). Disable
    # in test profiles that load the full context but want to exercise floods
    # without 429s by setting enabled=false.
    enabled: true
    rules:
      # /oauth2/token, both bare and tenant-prefixed forms. Per-client and
      # per-IP rules both fire — a request must pass both. Capacity 60 /
      # 1-min refill ≈ 1 req/sec sustained, 60-burst absorbed.
      oauth2-token-per-client:
        path-pattern: "(/t/[^/]+)?/oauth2/token"
        key: client-id
        capacity: 60
        refill-tokens: 60
        refill-period: 1m
      oauth2-token-per-ip:
        path-pattern: "(/t/[^/]+)?/oauth2/token"
        key: ip
        capacity: 60
        refill-tokens: 60
        refill-period: 1m
      # Public signup. Generous enough that a real user reloading the form a
      # few times before submit has headroom; tight enough that scripted
      # tenant-creation abuse trips fast.
      signup-per-ip:
        path-pattern: "/signup"
        key: ip
        capacity: 10
        refill-tokens: 10
        refill-period: 1h
      # Forgot-password is tenant-scoped (/t/{slug}/forgot-password). Per-IP
      # ceiling is the abuse-defence anchor; per-email rate-limiting is
      # already handled by the OTT-issuance debounce in slice 5.
      forgot-password-per-ip:
        path-pattern: "/t/[^/]+/forgot-password"
        key: ip
        capacity: 10
        refill-tokens: 10
        refill-period: 1h
spring:
  application:
    name: limen
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5433/auth
    username: auth
    password: secret
  flyway:
    enabled: true
  docker:
    compose:
      lifecycle-management: start_only
server:
  port: 8090
  servlet:
    session:
      timeout: 30m
management:
  endpoints:
    web:
      exposure:
        include: health
  # OpenTelemetry: signals (metrics, traces, logs) are pushed via OTLP/HTTP
  # to the endpoint configured by the OTel SDK. In dev, Spring Boot's
  # Docker Compose support auto-detects the `grafana/otel-lgtm` service
  # (compose `observability` profile) and wires endpoint + enables exports.
  # In production, override via standard OTel env vars:
  #   OTEL_EXPORTER_OTLP_ENDPOINT=https://otlp.example.com
  #   OTEL_EXPORTER_OTLP_HEADERS="Authorization=Basic <token>"
  #   OTEL_RESOURCE_ATTRIBUTES=deployment.environment=production
  #   OTEL_TRACES_SAMPLER_ARG=0.1
  # See docs/process/observability.md for the dev workflow.
  tracing:
    sampling:
      # 100% trace sampling locally; production should knock this down
      # via OTEL_TRACES_SAMPLER_ARG=0.1 (≈10%).
      probability: 1.0
  opentelemetry:
    resource-attributes:
      # `service.name` defaults to spring.application.name (`limen`).
      # `deployment.environment` is overridable via env at deploy time.
      deployment.environment: dev
    tracing:
      export:
        otlp:
          # Trace export endpoint. Micrometer's OtlpMeterRegistry has a
          # baked-in default for metrics, but tracing requires this
          # explicitly. Override per env via OTEL_EXPORTER_OTLP_ENDPOINT
          # (which sets the base URL; the SDK appends /v1/traces).
          endpoint: http://localhost:4318/v1/traces
    logging:
      export:
        otlp:
          # Same reasoning as tracing above. SDK appends /v1/logs.
          endpoint: http://localhost:4318/v1/logs
