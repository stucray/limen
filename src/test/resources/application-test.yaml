# Test profile. Activated via @ActiveProfiles("test") on integration tests that
# need the SMTP path (e.g. SmtpEmailSenderIntegrationTest); everyone else falls
# through to application.yaml's `limen.email.driver=logging` default.
#
# spring.mail.host / spring.mail.port are wired dynamically at runtime by
# TestcontainersConfiguration's MailpitContainer bean, since the container
# binds an ephemeral host port.
limen:
  email:
    driver: smtp
  signing-key-rotation:
    # Belt-and-braces off-switch for tests that explicitly @ActiveProfiles("test").
    # Most integration tests don't activate this profile and rely on the cron
    # not firing during a build's wall-clock window; tests that need
    # determinism on the rotation counters/audit rows opt into "test" so the
    # SigningKeyRotationSchedule bean is never created here.
    enabled: false
spring:
  mail:
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
